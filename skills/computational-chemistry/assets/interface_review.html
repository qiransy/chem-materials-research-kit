<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>材料界面与计算文件审查</title>
  <style>
    :root{color-scheme:light;--ink:#18212b;--muted:#607080;--line:#d8e0e7;--bg:#f3f6f8;--card:#fff;--blue:#155eef;--green:#087443;--amber:#9a5b00;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 28px;background:#132238;color:#fff}header h1{margin:0 0 5px;font-size:24px}header p{margin:0;color:#d7e1ed}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{padding:4px 9px;border-radius:999px;background:#ffffff1c;border:1px solid #ffffff3b}main{max-width:1500px;margin:auto;padding:18px}.notice{padding:12px 14px;border-radius:8px;border-left:4px solid var(--blue);background:#eaf1ff;margin:0 0 14px}.warning{border-color:var(--amber);background:#fff6df}.danger{border-color:var(--red);background:#ffebe9}.ok{border-color:var(--green);background:#e8f7ef}.selection,.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #192b3b0b}.panel h2,.panel h3{margin:0 0 10px}.surface-card,.candidate{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:#fbfcfd}label{display:block;font-weight:650;margin:9px 0 4px}select,input,textarea,button{font:inherit}select,input,textarea{width:100%;padding:8px;border:1px solid #aebdca;border-radius:6px;background:#fff}textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace}.editor{min-height:520px}button{border:0;border-radius:6px;padding:9px 13px;background:var(--blue);color:#fff;cursor:pointer}button.secondary{background:#556575}button.warn{background:var(--amber)}button.reject{background:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tabs button{background:#e5ebf0;color:var(--ink)}.tabs button.active{background:#132238;color:#fff}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}dl{display:grid;grid-template-columns:145px 1fr;gap:5px 10px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow:auto;background:#f5f7f9;border:1px solid var(--line);border-radius:7px;padding:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left;overflow-wrap:anywhere}th{background:#eef2f5}.LOW{color:#426176}.MEDIUM{color:var(--amber)}.HIGH,.CRITICAL{color:var(--red);font-weight:700}.file-link{display:block;margin:4px 0}.small{font-size:12px;color:var(--muted)}@media(max-width:950px){.selection,.workspace{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>材料界面选择、构建与计算文件审查</h1>
    <p>本页面只审查结构与待运行文件；不会运行计算程序、MPI、作业提交、队列查询或结果分析。</p>
    <div class="statusbar"><span class="badge" id="statusBadge">状态：加载中</span><span class="badge" id="versionBadge">版本：—</span><span class="badge" id="riskBadge">影响：—</span><span class="badge" id="executionBadge">计算/提交：未执行</span></div>
  </header>
  <main>
    <div id="message"></div>
    <section id="selectionSection" class="panel">
      <h2>由用户选择两个已批准表面及上下顺序</h2>
      <div class="notice warning">未确认下层、上层和顺序前，不得生成正式界面或计算文件。反转非对称界面的顺序不能自动视为等价。</div>
      <div class="selection">
        <div><label for="lowerSelect">下层材料表面</label><select id="lowerSelect"></select><div id="lowerCard"></div></div>
        <div><label for="upperSelect">上层材料表面</label><select id="upperSelect"></select><div id="upperCard"></div></div>
      </div>
      <div class="actions"><button id="swapSurfaces" class="secondary">交换上下顺序</button></div>
      <label for="orderRationale">顺序依据</label><textarea id="orderRationale" placeholder="实验基底关系、真空方向、后续吸附侧或界面偶极考虑"></textarea>
      <label><input id="allowSame" type="checkbox" style="width:auto"> 允许同一表面构建有明确依据的同质/对称界面</label>
      <label for="sameRationale">同表面选择依据</label><input id="sameRationale" placeholder="仅在选择同一表面两次使用">
      <label for="proposalFiles">可选：上传用户已有界面方案/结构文本</label><input id="proposalFiles" type="file" multiple>
      <label for="selectionNotes">用户说明</label><textarea id="selectionNotes"></textarea>
      <div class="actions"><button id="confirmSelection">确认表面与上下顺序</button></div>
    </section>

    <section id="reviewSection" hidden>
      <nav class="tabs" id="tabs">
        <button class="active" data-view="goal">第一阶段目标与软件</button><button data-view="surfaces">表面与顺序</button><button data-view="type">界面类型</button><button data-view="matching">晶格匹配</button><button data-view="candidates">候选与接触</button><button data-view="inputs">计算输入</button><button data-view="references">独立组分参考</button><button data-view="scripts">超算与本地脚本</button><button data-view="dependencies">依赖与待填项</button><button data-view="validation">静态检查</button><button data-view="history">版本与影响</button><button data-view="risks">风险提示</button>
      </nav>
      <div id="goal" class="view active"></div><div id="surfaces" class="view"></div><div id="type" class="view"></div><div id="matching" class="view"></div><div id="candidates" class="view"></div><div id="inputs" class="view"></div><div id="references" class="view"></div><div id="scripts" class="view"></div><div id="dependencies" class="view"></div><div id="validation" class="view"></div><div id="history" class="view"></div><div id="risks" class="view"></div>
      <div class="workspace">
        <section class="panel"><h2>当前界面与文件方案 JSON</h2><textarea id="designEditor" class="editor" spellcheck="false"></textarea><label for="editReason">修改原因</label><input id="editReason" placeholder="说明修改的科学或文件生成依据"><div class="actions"><button id="formatJson" class="secondary">格式化 JSON</button><button id="submitEdit">生成新版本并分析影响</button></div></section>
        <section class="panel"><h2>用户决策</h2><div class="notice">接受只会冻结界面结构和待运行文件，不会执行或提交它们。</div><label for="decisionReason">确认/操作说明</label><input id="decisionReason"><label for="restoreVersion">历史版本</label><select id="restoreVersion"></select><div class="actions"><button id="approveDesign">接受当前界面与文件</button><button id="continueEdit" class="secondary">继续修改</button><button id="restoreEdit" class="warn">恢复为新版本</button><button id="rejectEdit" class="reject">拒绝当前修改</button></div></section>
      </div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let state=null;
    function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=String(text);if(cls)n.className=cls;return n}
    function panel(title){const p=el("section",null,"panel");p.append(el("h2",title));return p}
    function compact(v){if(v===undefined||v===null)return"—";if(typeof v==="string")return v;return JSON.stringify(v)}
    function card(model,role){const c=el("article",null,"surface-card");c.append(el("h3",`${role} · ${model.id} · ${model.name||""}`));const dl=el("dl");[["材料",model.material],["晶面",model.miller_index],["终止",model.termination],["面内超胞",model.in_plane_supercell],["slab 层数",model.slab_layers],["缺陷",model.defect],["掺杂",model.doping],["官能化",model.functionalization],["固定区域",model.fixed_layers],["自旋",model.spin_setting],["表面版本",model.surface_design_version||state?.status?.surface_gate?.approved_version]].forEach(([k,v])=>dl.append(el("dt",k),el("dd",compact(v))));c.append(dl);return c}
    function table(headers,rows){const t=el("table"),thead=el("thead"),tr=el("tr");headers.forEach(x=>tr.append(el("th",x)));thead.append(tr);t.append(thead);const body=el("tbody");rows.forEach(row=>{const r=el("tr");row.forEach(x=>r.append(el("td",compact(x))));body.append(r)});t.append(body);return t}
    function fileList(records){const box=el("div");if(!records?.length){box.append(el("p","无或不适用"));return box}records.forEach(r=>{const a=el("a",`${r.path} · ${r.role||""} · ${r.sha256||""}`,"file-link");a.href=`/files/${encodeURI(r.path)}`;a.target="_blank";box.append(a)});return box}
    function showMessage(text,kind="danger"){const m=$("message");m.replaceChildren();if(text)m.append(el("div",text,`notice ${kind}`))}
    function selectedModel(id){return(state.available_surfaces||[]).find(x=>String(x.id)===String(id))}
    function populateSelection(){const models=state.available_surfaces||[];for(const id of["lowerSelect","upperSelect"]){const s=$(id);s.replaceChildren();models.forEach(m=>{const o=el("option",`${m.id} · ${m.material} · ${compact(m.miller_index)} · ${m.termination}`);o.value=m.id;s.append(o)})}if(models.length>1)$("upperSelect").selectedIndex=1;renderSelectionCards()}
    function renderSelectionCards(){const lower=selectedModel($("lowerSelect").value),upper=selectedModel($("upperSelect").value);$("lowerCard").replaceChildren(lower?card(lower,"下层"):el("p","无可用模型"));$("upperCard").replaceChildren(upper?card(upper,"上层"):el("p","无可用模型"))}
    async function uploads(){const result=[];for(const f of $("proposalFiles").files){const data=await f.arrayBuffer();let s="";new Uint8Array(data).forEach(b=>s+=String.fromCharCode(b));result.push({name:f.name,content_base64:btoa(s)})}return result}
    async function confirmSelection(){const payload={lower_surface_id:$("lowerSelect").value,upper_surface_id:$("upperSelect").value,user_selected:true,order_confirmed:true,order_rationale:$("orderRationale").value,allow_same_surface:$("allowSame").checked,same_surface_rationale:$("sameRationale").value,user_notes:$("selectionNotes").value,uploaded_files:await uploads()};await post("/api/select",payload);await load()}
    function renderGoal(){const p=panel("批准的研究目标、证据任务与软件");p.append(el("pre",JSON.stringify({research_goal:state.status.stage1_gate?.research_goal,approved_software_records:state.status.stage1_gate?.approved_software_records,method_snapshot:state.status.stage1_gate?.method_snapshot},null,2)));$("goal").replaceChildren(p)}
    function renderSurfaces(){const p=panel("用户选择的两个具体表面及上下顺序"),s=state.design.selection;p.append(card(s.lower_surface,"下层"),card(s.upper_surface,"上层"),el("p",`顺序依据：${s.order_rationale||"未说明"}`));$("surfaces").replaceChildren(p)}
    function renderType(){const p=panel("界面类型、模型形式与软件兼容性");p.append(el("pre",JSON.stringify({interface_type:state.design.interface_type,software_compatibility:state.design.software_compatibility},null,2)));$("type").replaceChildren(p)}
    function renderMatching(){const p=panel("二维晶格匹配、旋转与应变分配");p.append(table(["ID","A 超胞","B 超胞","旋转","A 应变","B 应变","面积","原子数","分配","状态"],(state.design.lattice_matches||[]).map(m=>[m.id,m.surface_a_supercell,m.surface_b_supercell,m.rotation_deg,m.strain_a,m.strain_b,m.interface_area,m.atom_count,m.strain_distribution,m.status])));$("matching").replaceChildren(p)}
    function renderCandidates(){const root=$("candidates");root.replaceChildren();const p=panel("候选界面、接触方式与结构文件"),grid=el("div",null,"grid");(state.design.candidates||[]).forEach(c=>{const x=el("article",null,"candidate");x.append(el("h3",`${c.id} · ${c.name}`),el("pre",JSON.stringify({match:c.match_id,translation:c.translation_fractional,rotation_deg:c.rotation_deg,initial_distance:c.initial_interface_distance,minimum_distance:c.minimum_intercomponent_distance,contacts:c.target_contact_pairs,interactions:c.interaction_types,fixed:c.fixed_region,relaxed:c.relaxed_region,vacuum:c.vacuum,boundary:c.boundary_conditions,dipole:c.dipole_handling,spin:c.spin_setting,classification:c.classification,scientific_use:c.scientific_use,geometry_checks:c.geometry_checks},null,2)),fileList(c.structure_files));grid.append(x)});p.append(grid);root.append(p)}
    function renderInputs(){const p=panel("预筛选与正式优化输入文件");p.append(el("pre",JSON.stringify({packages:state.design.calculation_packages,optimization_parameters:state.design.optimization_parameters},null,2)),fileList(state.design.generated_artifacts?.calculation_inputs));$("inputs").replaceChildren(p)}
    function renderReferences(){const p=panel("应变一致的独立组分参考文件");p.append(el("pre",JSON.stringify(state.design.comparison_policy,null,2)),fileList(state.design.generated_artifacts?.reference_components));$("references").replaceChildren(p)}
    function renderScripts(){const p=panel("超算提交、环境加载与本地运行模板（只展示，不执行）");p.append(el("pre",JSON.stringify(state.design.hpc_configuration,null,2)),fileList(state.design.generated_artifacts?.hpc_scripts),fileList(state.design.generated_artifacts?.local_run_scripts));$("scripts").replaceChildren(p)}
    function renderDependencies(){const p=panel("依赖文件和待用户填写参数");p.append(el("pre",JSON.stringify({dependencies:state.design.dependencies,pending_fields:state.design.hpc_configuration?.pending_fields},null,2)),fileList(state.design.generated_artifacts?.dependencies));$("dependencies").replaceChildren(p)}
    function renderValidation(){const p=panel("输入文件静态检查");p.append(el("pre",JSON.stringify({declared:state.design.static_validation,engine:state.design.engine_static_validation},null,2)),el("div","静态检查不能判断收敛、稳定结构、平衡距离、能量、电荷转移或电子结构结果。","notice warning"));$("validation").replaceChildren(p)}
    function renderHistory(){const p=panel("不可变版本、差异与影响分析");p.append(table(["时间","事件","版本","前一版本","原因","状态"],(state.change_log||[]).map(x=>[x.timestamp,x.event,x.version||x.new_version,x.previous_version||x.source_version,x.reason,`${x.status_before||"—"} → ${x.status_after||"—"}`])));if(state.analysis)p.append(el("h3",`最近影响：${state.analysis.overall_impact_level}`,state.analysis.overall_impact_level),table(["路径","修改前","修改后","等级","影响","建议"],(state.analysis.changes||[]).map(x=>[x.path,x.before,x.after,x.impact_level,x.impact_reason,x.recommendation])));$("history").replaceChildren(p);const s=$("restoreVersion");s.replaceChildren();(state.versions||[]).forEach(v=>{const o=el("option",v);o.value=v;s.append(o)})}
    function renderRisks(){const p=panel("结构、科学、依赖和执行风险");(state.status.validation_errors||[]).forEach(x=>p.append(el("p",`错误：${x}`,"CRITICAL")));(state.status.validation_warnings||[]).forEach(x=>p.append(el("p",`警告：${x}`,"MEDIUM")));(state.design.known_risks||[]).forEach(x=>p.append(el("p",compact(x))));p.append(el("h3","实际检测到的结构工具"),el("pre",JSON.stringify(state.status.detected_structure_tools||{},null,2)),el("div","本步骤不会运行生成文件；只有用户在外部环境中自行执行。","notice danger"));$("risks").replaceChildren(p)}
    function buttons(){const approved=state.status.status==="INTERFACE_FILES_APPROVED",has=!!state.design,invalid=(state.status.validation_errors||[]).length>0;$("submitEdit").disabled=!has||approved;$("approveDesign").disabled=!has||approved||invalid;$("continueEdit").disabled=!has||approved;$("restoreEdit").disabled=!has||approved;$("rejectEdit").disabled=!has||approved||!state.status.previous_version}
    async function post(url,payload){showMessage("");const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"操作失败");return d}
    async function submitEdit(){let design;try{design=JSON.parse($("designEditor").value)}catch(e){throw new Error("方案 JSON 无效："+e.message)}await post("/api/submit",{design,reason:$("editReason").value});await load()}
    async function action(name){await post("/api/action",{action:name,reason:$("decisionReason").value,version:$("restoreVersion").value,confirmed_by:"user"});await load()}
    async function load(){try{const r=await fetch("/api/state",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"加载失败");state=d;$("statusBadge").textContent=`状态：${d.status.status}`;$("versionBadge").textContent=`版本：${d.status.current_candidate_version||"—"}`;$("riskBadge").textContent=`影响：${d.status.last_impact_level||"—"}`;$("executionBadge").textContent=`计算/提交：${d.status.calculation_executed||d.status.job_submitted?"异常":"未执行"}`;const waiting=d.status.status==="WAITING_FOR_INTERFACE_SELECTION";$("selectionSection").hidden=!waiting;$("reviewSection").hidden=!d.design;if(waiting)populateSelection();if(d.design){$("designEditor").value=JSON.stringify(d.design,null,2);renderGoal();renderSurfaces();renderType();renderMatching();renderCandidates();renderInputs();renderReferences();renderScripts();renderDependencies();renderValidation();renderHistory();renderRisks();buttons()}if(d.status.status==="INTERFACE_FILES_APPROVED")showMessage("当前界面结构与计算文件已冻结；未运行计算，也未提交作业。","ok")}catch(e){showMessage(e.message)}}
    $("lowerSelect").addEventListener("change",renderSelectionCards);$("upperSelect").addEventListener("change",renderSelectionCards);$("swapSurfaces").addEventListener("click",()=>{const a=$("lowerSelect").value;$("lowerSelect").value=$("upperSelect").value;$("upperSelect").value=a;renderSelectionCards()});$("confirmSelection").addEventListener("click",()=>confirmSelection().catch(e=>showMessage(e.message)));$("formatJson").addEventListener("click",()=>{try{$("designEditor").value=JSON.stringify(JSON.parse($("designEditor").value),null,2)}catch(e){showMessage(e.message)}});$("submitEdit").addEventListener("click",()=>submitEdit().catch(e=>showMessage(e.message)));$("approveDesign").addEventListener("click",()=>action("approve").catch(e=>showMessage(e.message)));$("continueEdit").addEventListener("click",()=>action("continue").catch(e=>showMessage(e.message)));$("restoreEdit").addEventListener("click",()=>action("restore").catch(e=>showMessage(e.message)));$("rejectEdit").addEventListener("click",()=>action("reject").catch(e=>showMessage(e.message)));$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===b.dataset.view))});load();
  </script>
</body>
</html>
