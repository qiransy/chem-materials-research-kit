<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>科学结论、计算方法与复现说明审查</title>
  <style>
    :root{color-scheme:light;--ink:#172230;--muted:#607080;--line:#d6dee7;--bg:#f3f6f8;--card:#fff;--navy:#15324c;--blue:#1769df;--green:#087443;--amber:#9a5b00;--red:#b42318;--open:#5b3f91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.58 system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 28px;background:var(--navy);color:#fff}header h1{margin:0 0 5px;font-size:24px}header p{margin:0;color:#dbe7f1}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.badge{padding:4px 9px;border:1px solid #ffffff3b;border-radius:999px;background:#ffffff17}main{max-width:1540px;margin:auto;padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #1525360a}.panel h2,.panel h3{margin:0 0 10px}.actual{border-left:6px solid var(--blue)}.opensource{border-left:6px solid var(--open);background:#fbf9ff}.notice{padding:12px 14px;margin:0 0 14px;border-radius:8px;border-left:4px solid var(--blue);background:#eaf2ff}.notice.ok{border-color:var(--green);background:#e8f7ef}.notice.warning{border-color:var(--amber);background:#fff5dc}.notice.danger{border-color:var(--red);background:#ffebe9}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#e4eaf0;color:var(--ink)}.tabs button.active{background:var(--navy);color:#fff}.view{display:none}.view.active{display:block}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:7px;vertical-align:top;text-align:left;overflow-wrap:anywhere}th{background:#eef2f5}pre{white-space:pre-wrap;overflow:auto;max-height:680px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#f6f8fa}label{display:block;font-weight:650;margin:9px 0 4px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;padding:8px;border:1px solid #aab8c6;border-radius:6px;background:#fff}textarea{min-height:650px;font-family:ui-monospace,Consolas,monospace}button{border:0;border-radius:6px;padding:9px 13px;background:var(--blue);color:#fff;cursor:pointer}button.secondary{background:#556575}button.warn{background:var(--amber)}button.approve{background:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.strength{font-weight:700}.STRONGLY_SUPPORTED,.SUPPORTED{color:var(--green)}.PARTIALLY_SUPPORTED,.INCONCLUSIVE{color:var(--amber)}.CONTRADICTED,.CRITICAL,.HIGH{color:var(--red);font-weight:700}.MEDIUM{color:var(--amber);font-weight:700}.small{font-size:12px;color:var(--muted)}a{color:var(--blue)}@media(max-width:980px){.workspace{grid-template-columns:1fr}textarea{min-height:430px}}
  </style>
</head>
<body>
  <header>
    <h1>科学结论、论文计算方法与开源复现说明</h1>
    <p>真实计算来源、科学解释和未来开源迁移建议严格分区；本页面不执行计算、后处理、作图、投稿或开源复算。</p>
    <div class="badges"><span class="badge" id="stateBadge">状态：加载中</span><span class="badge" id="versionBadge">版本：—</span><span class="badge" id="impactBadge">影响：—</span><span class="badge" id="submissionBadge">投稿就绪：—</span><span class="badge">执行/作图/投稿：均未进行</span></div>
  </header>
  <main>
    <div id="message"></div>
    <nav class="tabs" id="tabs"><button class="active" data-view="gate">来源门禁</button><button data-view="actual">真实计算方法与来源</button><button data-view="conclusions">分层科学结论</button><button data-view="discussion">结果与实验对应</button><button data-view="citations">引用与许可</button><button data-view="opensource">开源软件复现建议</button><button data-view="pending">待补充与影响</button><button data-view="history">版本历史</button></nav>
    <section id="gate" class="view active"></section><section id="actual" class="view"></section><section id="conclusions" class="view"></section><section id="discussion" class="view"></section><section id="citations" class="view"></section><section id="opensource" class="view"></section><section id="pending" class="view"></section><section id="history" class="view"></section>
    <section id="editorWorkspace" class="workspace" hidden>
      <div class="panel">
        <h2>当前稿件候选 JSON</h2>
        <div class="notice warning">编辑文章类型、风格、术语、段落和受证据约束的表述。实际软件、参数、公式来源、证据 ID 和源强度受保护；冲突编辑会被拒绝且不会覆盖当前版本。</div>
        <textarea id="candidateEditor" spellcheck="false"></textarea>
        <label for="editReason">修改原因</label><input id="editReason" placeholder="说明风格、段落、表述或开源映射修改依据">
        <div class="actions"><button id="formatJson" class="secondary">格式化 JSON</button><button id="saveVersion">保存为新版本并分析影响</button></div>
      </div>
      <div class="panel">
        <h2>用户审查决定</h2>
        <label for="actionReason">审查/批准说明</label><textarea id="actionReason" style="min-height:120px"></textarea>
        <label for="restoreVersion">历史版本</label><select id="restoreVersion"></select>
        <div class="actions"><button id="readyApproval">当前版本已审查，进入批准</button><button id="continueEditing" class="secondary">返回继续编辑</button><button id="restoreCandidate" class="warn">恢复为新版本</button><button id="approveContent" class="approve">批准最终内容</button></div>
        <div class="notice">批准只冻结稿件内容，不提交论文、不上传仓库、不分发受限文件，也不表示开源软件已经重算本文结果。</div>
      </div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let state=null;
    function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined&&text!==null)node.textContent=String(text);if(cls)node.className=cls;return node}
    function panel(title,cls=""){const box=el("div",null,`panel ${cls}`.trim());box.append(el("h2",title));return box}
    function compact(value){if(value===undefined||value===null||value==="")return"—";return typeof value==="string"?value:JSON.stringify(value)}
    function table(headers,rows){const t=el("table"),head=el("thead"),hr=el("tr");headers.forEach(x=>hr.append(el("th",x)));head.append(hr);t.append(head);const body=el("tbody");rows.forEach(row=>{const tr=el("tr");row.forEach(x=>tr.append(el("td",compact(x))));body.append(tr)});t.append(body);return t}
    function showMessage(text,kind="danger"){$("message").replaceChildren();if(text)$("message").append(el("div",text,`notice ${kind}`))}
    function relativeFile(path){const normalized=String(path||"").replaceAll("\\","/"),root=String(state?.manuscript_dir||"").replaceAll("\\","/").replace(/\/$/,"");if(!root||!normalized.toLowerCase().startsWith((root+"/").toLowerCase()))return null;return normalized.slice(root.length+1)}
    function fileLink(record,label){const path=record?.path||"",relative=relativeFile(path),a=el("a",label||path);if(relative){a.href=`/files/${encodeURI(relative)}`;a.target="_blank"}else{a.title="只读上游来源"}return a}
    function renderGate(){const p=panel("冻结的上游批准与结论来源");p.append(table(["项目","批准结论数","有效任务","第三阶段证据节点","上游记录数"],[[state.status.project_id,state.upstream.approved_stage3_conclusions.length,state.upstream.valid_task_ids,state.upstream.stage3_validated_evidence_node_ids,state.upstream.records.length]]),el("div","第四阶段只读这些路径和 SHA-256；任何变化都会阻止继续写入。","notice ok"));$("gate").replaceChildren(p)}
    function renderActual(){const p=panel("真实计算方法与来源","actual"),i=state.source_inventory,c=state.candidate;if(!i){p.append(el("p","尚未提交实际软件/输入/输出来源清单。"));$("actual").replaceChildren(p);return}p.append(el("div","以下软件与参数来自用户实际输入、输出和来源证据；开源建议不会替换这些记录。","notice"),table(["任务","实际软件","版本","模块","许可类别","身份识别证据","计划—实际差异"],i.tasks.map(t=>[`${t.task_id} · ${t.task_name}`,t.actual_software.name,t.actual_software.version_display,t.actual_software.module,t.actual_software.license_category,t.software_identification_evidence,t.actual_vs_planned_differences])));i.tasks.forEach(t=>{const box=panel(`${t.task_id} 实际参数与文件`);box.append(table(["参数","状态","实际值","来源"],Object.entries(t.actual_parameters).map(([k,v])=>[k,v.status,v.value,v.source_file_refs])));t.files.forEach(f=>box.append(fileLink(f,`${f.file_ref} · ${f.role} · ${f.sha256}`),el("br")));p.append(box)});if(c)p.append(el("h3","论文计算方法完整版"),el("pre",c.method_full),el("h3","论文计算方法精简版"),el("pre",c.method_concise));$("actual").replaceChildren(p)}
    function renderConclusions(){const p=panel("数据、性质、机制与总体结论"),c=state.candidate;if(!c){p.append(el("p","尚未生成稿件候选。"));$("conclusions").replaceChildren(p);return}p.append(table(["层级/ID","源强度","稿件强度","证据角色","直接依据","结论文本","边界"],c.conclusion_claims.map(x=>[`${x.level} · ${x.claim_id}`,x.source_strength,x.draft_strength,x.evidence_roles,x.direct_data_basis,x.text,x.boundary])));p.append(el("h3","各证据节点"),table(["节点","结构化结论","段落"],c.evidence_node_conclusions.map(x=>[x.evidence_node_id,x.claim_ids,x.text])),el("h3","总体科学结论"),el("pre",c.overall_conclusion));$("conclusions").replaceChildren(p)}
    function renderDiscussion(){const p=panel("围绕科学问题组织的结果与讨论"),c=state.candidate;if(!c){p.append(el("p","尚未生成。"));$("discussion").replaceChildren(p);return}p.append(el("pre",c.result_discussion),el("h3","理论—实验对应"),table(["映射","结论","关系","说明","边界"],c.theory_experiment_correspondence.map(x=>[x.mapping_id,x.claim_ids,x.relation,x.text,x.boundary])));$("discussion").replaceChildren(p)}
    function renderCitations(){const p=panel("软件引用、许可与文件共享"),r=state.license_review,c=state.candidate;if(!r){p.append(el("p","尚未完成许可审查。"));$("citations").replaceChildren(p);return}p.append(table(["软件","任务","许可类别","分类来源","输入共享","公开措施","受限依赖"],r.items.map(x=>[x.software_name,x.actual_task_ids,x.license_category,x.classification_source,x.input_sharing,x.public_release_action,x.restricted_dependencies])),el("h3","公开发布阻断项"),el("pre",JSON.stringify(r.public_release_blockers,null,2)),el("h3","稿件引用文本"),el("pre",c?.software_citation_text||"—"),el("h3","稿件许可文本"),el("pre",c?.license_review_text||"—"));$("citations").replaceChildren(p)}
    function renderOpenSource(){const p=panel("开源软件复现建议（未来路径，非现有结果来源）","opensource"),c=state.candidate;if(!c){p.append(el("p","尚未生成。"));$("opensource").replaceChildren(p);return}p.append(el("div","本区域与真实计算方法严格分开。参数映射和模板均未执行，不证明已有结果由替代软件产生。","notice warning"),el("pre",c.open_source_reproduction_note));c.open_source_mappings.forEach(m=>p.append(el("h3",`${m.actual_task_id} · 实际软件 ${m.actual_software}`),table(["建议替代","能力检查","依据"],m.proposed_alternatives.map(x=>[x.name,x.capability_status,x.capability_basis])),el("h3","参数等效性"),table(["实际参数","实际值","建议设置","等效性","理由"],m.parameter_mappings.map(x=>[x.actual_parameter,x.actual_value,x.proposed_setting,x.equivalence,x.rationale])),el("pre",`建议模板（未执行）：\n${m.suggested_input_template}`)));$("opensource").replaceChildren(p)}
    function renderPending(){const p=panel("待补充信息与修改影响"),c=state.candidate,i=state.impact;p.append(table(["实际参数阻断","投稿/公开待办","用户待补充","投稿就绪"],[[c?.blocking_items||[],c?.publication_pending_items||[],c?.pending_user_information||[],c?.submission_ready??false]]));if(i)p.append(el("h3",`修改影响：${i.overall_impact}`),table(["路径","影响","科学影响","动作"],i.changes.map(x=>[x.path,x.impact,x.scientific_effect,x.required_action])));$("pending").replaceChildren(p)}
    function renderHistory(){const p=panel("不可变版本与审批历史");p.append(el("h3","候选文件"));(state.status.candidate_records||[]).forEach(r=>p.append(fileLink(r.artifacts.plan,`${r.version} · ${r.state} · 影响 ${r.overall_impact}`),el("br")));p.append(el("h3","变更日志"),table(["时间","事件","版本","状态/说明"],state.change_log.map(x=>[x.recorded_at,x.event,x.version||"",x.state||x.reason||""])));$("history").replaceChildren(p)}
    function editableCandidate(c){if(!c)return null;const skip=new Set(["plan_version","generated_at","version_record","current_state","blocking_items","publication_pending_items","submission_ready","formula_records","calculation_executed_by_skill","postprocessing_executed_by_skill","job_submitted_by_skill","queue_queried_by_skill","remote_result_retrieval","background_monitoring","research_figures_generated_by_skill","open_source_recalculation_performed","existing_results_attributed_to_alternative"]);return Object.fromEntries(Object.entries(c).filter(([k])=>!skip.has(k)))}
    function render(){const s=state.status,c=state.candidate;$("stateBadge").textContent=`状态：${s.status}`;$("versionBadge").textContent=`版本：${s.current_candidate_version||"—"}`;$("impactBadge").textContent=`影响：${state.impact?.overall_impact||"—"}`;$("submissionBadge").textContent=`投稿就绪：${c?.submission_ready?"是":"否/待补充"}`;renderGate();renderActual();renderConclusions();renderDiscussion();renderCitations();renderOpenSource();renderPending();renderHistory();$("editorWorkspace").hidden=!c||s.status==="MANUSCRIPT_CONTENT_APPROVED";if(c)$("candidateEditor").value=JSON.stringify(editableCandidate(c),null,2);const select=$("restoreVersion");select.replaceChildren();state.versions.filter(v=>v!==s.current_candidate_version).forEach(v=>{const o=el("option",v);o.value=v;select.append(o)});$("readyApproval").disabled=s.status!=="WAITING_FOR_MANUSCRIPT_REVIEW";$("continueEditing").disabled=s.status!=="WAITING_FOR_MANUSCRIPT_APPROVAL";$("approveContent").disabled=s.status!=="WAITING_FOR_MANUSCRIPT_APPROVAL";$("restoreCandidate").disabled=!select.options.length||!["WAITING_FOR_MANUSCRIPT_REVIEW","WAITING_FOR_MANUSCRIPT_APPROVAL"].includes(s.status)}
    async function post(url,payload){showMessage("");const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||"操作失败");return data}
    async function load(){try{const response=await fetch("/api/state",{cache:"no-store"}),data=await response.json();if(!response.ok)throw new Error(data.error||"加载失败");state=data;render()}catch(error){showMessage(error.message)}}
    $("formatJson").onclick=()=>{try{$("candidateEditor").value=JSON.stringify(JSON.parse($("candidateEditor").value),null,2)}catch(error){showMessage(error.message)}};
    $("saveVersion").onclick=async()=>{try{await post("/api/submit",{candidate:JSON.parse($("candidateEditor").value),reason:$("editReason").value});await load();showMessage("修改已保存为新版本，并完成影响分析。","ok")}catch(error){showMessage(error.message)}};
    async function action(name,version=null){await post("/api/action",{action:name,reason:$("actionReason").value,version,confirmed_by:"user"});await load()}
    $("readyApproval").onclick=async()=>{try{await action("ready-for-approval");showMessage("当前版本已进入最终批准门禁。","ok")}catch(error){showMessage(error.message)}};
    $("continueEditing").onclick=async()=>{try{await action("continue-editing");showMessage("已返回编辑状态。","ok")}catch(error){showMessage(error.message)}};
    $("restoreCandidate").onclick=async()=>{try{await action("restore",$("restoreVersion").value);showMessage("历史版本已恢复为新的不可变版本。","ok")}catch(error){showMessage(error.message)}};
    $("approveContent").onclick=async()=>{try{await action("approve");showMessage("最终稿件内容已批准并冻结。","ok")}catch(error){showMessage(error.message)}};
    $("tabs").onclick=event=>{const button=event.target.closest("button[data-view]");if(!button)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===button.dataset.view))};
    load();
  </script>
</body>
</html>
